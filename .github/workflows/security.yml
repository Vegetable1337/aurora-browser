name: Windows security regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust-browser
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: node ../packaging/check-ui-syntax.cjs
      - run: cargo build --example extensions_probe --locked
      - run: cargo build --locked
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  legacy-reference:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
