name: Build Windows Alpha artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-alpha:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependency auditor
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Verify format, tests, lints, UI syntax, and dependencies
        working-directory: rust-browser
        shell: pwsh
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
          node ../packaging/check-ui-syntax.cjs
          cargo audit

      - name: Build optimized Windows executable
        working-directory: rust-browser
        run: cargo build --release --locked

      - name: Check executable metadata
        shell: pwsh
        run: |
          $exe = Get-Item rust-browser/target/release/aurora-browser.exe
          if ($exe.VersionInfo.ProductName -ne 'Aurora Browser') { throw "Unexpected ProductName: $($exe.VersionInfo.ProductName)" }
          if ($exe.VersionInfo.ProductVersion -ne '0.1.0-alpha') { throw "Unexpected ProductVersion: $($exe.VersionInfo.ProductVersion)" }
          if ($exe.VersionInfo.OriginalFilename -ne 'Aurora.exe') { throw "Unexpected OriginalFilename: $($exe.VersionInfo.OriginalFilename)" }

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw "Inno Setup checksum mismatch: $actualHash" }
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }

      - name: Build per-user installer and portable ZIP
        shell: pwsh
        run: ./packaging/package-alpha.ps1 -IsccPath 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'

      - name: Upload Windows Alpha artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Windows-x64-0.1.0-alpha
          path: dist/alpha/*
          if-no-files-found: error
          retention-days: 30
