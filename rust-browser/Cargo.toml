[package]
name = "aurora-browser"
version = "0.2.0-alpha.1"
edition = "2024"
description = "Aurora desktop browser, Rust and WebView2 prototype"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
zeroize = "1"
winit = "0.30"
wry = "0.57"
image = { version = "0.25", default-features = false, features = ["png"] }
percent-encoding = "2"
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com"] }
webview2-com = "0.39"

[profile.release]
lto = true
codegen-units = 1
strip = true
