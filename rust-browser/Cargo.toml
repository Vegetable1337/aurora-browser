[package]
name = "aurora-browser"
version = "0.1.0"
edition = "2024"
description = "Aurora desktop browser, Rust and WebView2 prototype"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
winit = "0.30"
wry = "0.57"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
